name: Marketplace MySQL migration and legacy import test

on:
  push:
    branches: [rebuild/locked-marketplace-v1]
    paths:
      - 'database/migrations/**'
      - 'tools/import-legacy-financial-history.php'
      - 'tests/**'
      - '.github/workflows/mysql-migration-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/**'
      - 'tools/import-legacy-financial-history.php'
      - 'tests/**'
      - '.github/workflows/mysql-migration-test.yml'

jobs:
  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: poketflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl
      - name: Load disposable legacy schema
        run: mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot poketflow_test < tests/fixtures/legacy-minimal-schema.sql
      - name: Apply all marketplace migrations in order
        run: |
          set -euo pipefail
          for migration in \
            database/migrations/20261106_001_locked_marketplace_core.sql \
            database/migrations/20261106_002_financial_workflows.sql \
            database/migrations/20261106_003_legacy_financial_preservation.sql \
            database/migrations/20261106_004_authentication_workflows.sql \
            database/migrations/20261106_005_blog_sponsorship_workflow.sql; do
            echo "Applying marketplace migration $migration"
            mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot poketflow_test < "$migration"
          done
      - name: Create disposable CLI config
        run: |
          cat > /tmp/poketflow-test-config.php <<'PHP'
          <?php
          return [
              'host' => '127.0.0.1',
              'dbname' => 'poketflow_test',
              'username' => 'root',
              'password' => 'root',
              'charset' => 'utf8mb4',
              'encryption_key' => base64_encode(str_repeat('K', 32)),
          ];
          PHP
      - name: Run guarded legacy import and reconciliation
        env:
          POKETFLOW_CONFIG: /tmp/poketflow-test-config.php
        run: |
          printf 'IMPORT LEGACY FINANCIAL HISTORY INTO poketflow_test\n' | php tools/import-legacy-financial-history.php --apply
      - name: Verify preserved balances, accounts and archived history
        run: |
          set -euo pipefail
          test "$(mysql -N -h127.0.0.1 -uroot -proot poketflow_test -e "SELECT COUNT(*) FROM pf_account_modes WHERE user_id=1 AND can_work=1 AND can_advertise=1")" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot poketflow_test -e "SELECT COUNT(*) FROM pf_wallets WHERE user_id=1")" = "2"
          test "$(mysql -N -h127.0.0.1 -uroot -proot poketflow_test -e "SELECT FORMAT(SUM(l.amount),2) FROM pf_wallet_ledger l JOIN pf_wallets w ON w.id=l.wallet_id WHERE w.user_id=1 AND w.wallet_type='WORKER' AND l.reference_type='LEGACY_WALLET_TXN'")" = "10.25"
          test "$(mysql -N -h127.0.0.1 -uroot -proot poketflow_test -e "SELECT COUNT(*) FROM pf_withdrawals WHERE legacy_withdrawal_id=1 AND status='REJECTED' AND method_network='TRC20' AND destination_encrypted IS NOT NULL")" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot poketflow_test -e "SELECT COUNT(*) FROM pf_legacy_history WHERE source_table='campaigns'")" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot poketflow_test -e "SELECT COUNT(*) FROM pf_legacy_history WHERE source_table='conversions'")" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot poketflow_test -e "SELECT COUNT(*) FROM pf_blog_campaigns WHERE sync_status='PENDING'")" = "0"
